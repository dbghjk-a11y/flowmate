
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowMate - 회의 메모 정리</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 130px;
      box-sizing: border-box;
      padding: 12px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    li {
      margin: 12px 0;
    }
   
li {
  list-style: none;
}

li label {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

li input[type="checkbox"] {
  width: 18px;
  height: 18px;
}

li.completed span {
  text-decoration: line-through;
  color: gray;
}
 
.task-details {
  display: flex;
  gap: 10px;
  margin: 10px 0 20px 28px;
}

.task-field {
  flex: 1;
  min-width: 0;
}

.task-field label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  color: #555;
}

.task-field input {
  width: 100%;
  box-sizing: border-box;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

@media (max-width: 480px) {
  .task-details {
    flex-direction: column;
  }
}

  </style>
</head>

<body>
  <div class="container">
    <h1>FlowMate</h1>
    <p>회의 메모를 할 일 목록으로 정리하세요.</p>

    <textarea id="memo"
      placeholder="회의 내용을 입력하세요."></textarea>

    <button onclick="makeTasks()">
      할 일 목록 만들기
    </button>

    <h2>할 일 목록</h2>
    <ul id="taskList"></ul>
  </div>

 
<script>
  function makeTasks() {
    const memo = document.getElementById("memo").value;
    const taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    const sentences = memo.split(/[.\n。]+/);

    sentences.forEach(function(sentence) {
      if (sentence.trim() === "") {
        return;
      }

      // 1. 할 일 항목 생성
      const li = document.createElement("li");

      // 2. 체크박스와 업무 이름
      const checkboxLabel = document.createElement("label");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      const span = document.createElement("span");
      span.textContent = sentence.trim();

      checkbox.addEventListener("change", function() {
        li.classList.toggle("completed", checkbox.checked);
      });

      checkboxLabel.appendChild(checkbox);
      checkboxLabel.appendChild(span);
      li.appendChild(checkboxLabel);

      // 3. 담당자와 마감일 영역
      const details = document.createElement("div");
      details.className = "task-details";

      // 담당자 입력칸
      const ownerField = document.createElement("div");
      ownerField.className = "task-field";

      const ownerLabel = document.createElement("label");
      ownerLabel.textContent = "담당자";

      const ownerInput = document.createElement("input");
      ownerInput.type = "text";
      ownerInput.placeholder = "담당자 이름";

      ownerField.appendChild(ownerLabel);
      ownerField.appendChild(ownerInput);

      // 마감일 입력칸
      const dueField = document.createElement("div");
      dueField.className = "task-field";

      const dueLabel = document.createElement("label");
      dueLabel.textContent = "마감일";

      const dueInput = document.createElement("input");
      dueInput.type = "date";

      dueField.appendChild(dueLabel);
      dueField.appendChild(dueInput);

      // 4. 화면에 추가
      details.appendChild(ownerField);
      details.appendChild(dueField);

      li.appendChild(details);
      taskList.appendChild(li);
    });
  }
</script>

</body>
</html>
